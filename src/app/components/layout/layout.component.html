<div class="flex min-h-screen">
  <!-- Sidebar solo para rutas admin -->
  <ng-container *ngIf="isAdminRoute">
    <app-admin-sidebar #sidebar />
  </ng-container>
  <div class="flex flex-col flex-1 min-h-screen">
    <app-header />
    <main class="flex-grow main-content" [style.marginLeft]="isAdminRoute ? (sidebar?.isCollapsed ? '64px' : '220px') : '0'">
      <router-outlet />
    </main>
    <app-footer />
  </div>
</div>
