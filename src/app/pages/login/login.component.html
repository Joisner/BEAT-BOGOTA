<div class="min-h-screen bg-black relative overflow-hidden flex items-center justify-center">
  <!-- Animated Background -->
  <div class="absolute inset-0 bg-gradient-to-br from-purple-900/20 via-black to-pink-900/20"></div>
  <div
    class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-purple-500/5 via-transparent to-transparent animate-pulse">
  </div>

  <!-- Floating particles effect -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-2 h-2 bg-purple-400 rounded-full opacity-30 animate-bounce"
      style="animation-delay: 0s;"></div>
    <div class="absolute top-1/3 right-1/3 w-1 h-1 bg-pink-400 rounded-full opacity-40 animate-bounce"
      style="animation-delay: 1s;"></div>
    <div class="absolute bottom-1/4 left-1/3 w-3 h-3 bg-blue-400 rounded-full opacity-20 animate-bounce"
      style="animation-delay: 2s;"></div>
    <div class="absolute bottom-1/3 right-1/4 w-2 h-2 bg-cyan-400 rounded-full opacity-30 animate-bounce"
      style="animation-delay: 1.5s;"></div>
    <div class="absolute top-1/2 left-1/6 w-1 h-1 bg-yellow-400 rounded-full opacity-25 animate-bounce"
      style="animation-delay: 0.5s;"></div>
    <div class="absolute top-3/4 right-1/6 w-2 h-2 bg-green-400 rounded-full opacity-35 animate-bounce"
      style="animation-delay: 3s;"></div>
  </div>

  <!-- Login Container -->
  <div class="relative z-10 w-full max-w-md mx-auto px-6">
    <br>
    <!-- Login Form Container -->
    <div
      class="bg-gradient-to-br from-gray-900/80 to-black/80 backdrop-blur-sm border border-gray-700/50 rounded-3xl p-8 shadow-2xl hover:shadow-purple-500/10 transition-all duration-500">

      <!-- Form Header -->
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Iniciar Sesión</h2>
        <p class="text-gray-400">Conecta con la mejor música electrónica</p>
      </div>

      <div *ngIf="error" class="mb-4 p-4 bg-red-900/50 border border-red-700 text-red-200 rounded-lg">
        {{ error }}
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Username Field -->
        <div class="group">
          <label for="username" class="block text-lg font-semibold text-gray-200 mb-3">
            Usuario
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-6 w-6 text-gray-400 group-focus-within:text-purple-400 transition-colors duration-300"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario"
              [(ngModel)]="email" [disabled]="loading"
              class="w-full bg-gray-800/60 border-2 border-gray-600/50 rounded-xl pl-12 pr-6 py-4 text-white text-lg placeholder-gray-400 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-300 hover:border-gray-500/70 focus:transform focus:scale-[1.02]">
          </div>
        </div>

        <!-- Password Field -->
        <div class="group">
          <label for="password" class="block text-lg font-semibold text-gray-200 mb-3">
            Contraseña
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-6 w-6 text-gray-400 group-focus-within:text-purple-400 transition-colors duration-300"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
              </svg>
            </div>
            <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña"
              [(ngModel)]="password" [disabled]="loading"
              class="w-full bg-gray-800/60 border-2 border-gray-600/50 rounded-xl pl-12 pr-6 py-4 text-white text-lg placeholder-gray-400 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-300 hover:border-gray-500/70 focus:transform focus:scale-[1.02]">

            <!-- Show/Hide Password Button -->
            <button type="button"
              class="absolute inset-y-0 right-0 pr-4 flex items-center hover:bg-gray-700/30 rounded-r-xl transition-colors duration-300">
              <svg class="h-6 w-6 text-gray-400 hover:text-purple-400" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center cursor-pointer group">
            <input type="checkbox" class="sr-only">
            <div class="relative">
              <div
                class="w-5 h-5 bg-gray-600 border-2 border-gray-500 rounded-md group-hover:border-purple-400 transition-colors duration-300">
              </div>
              <svg
                class="absolute inset-0 w-5 h-5 text-purple-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"
                fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                  clip-rule="evenodd"></path>
              </svg>
            </div>
            <span
              class="ml-2 text-gray-300 group-hover:text-purple-300 transition-colors duration-300">Recordarme</span>
          </label>

          <a href="#" class="text-purple-400 hover:text-purple-300 transition-colors duration-300 font-medium">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Login Button -->
        <button type="submit" [disabled]="loading"
          class="group relative w-full bg-gradient-to-r from-purple-600 via-pink-600 to-purple-600 bg-size-200 bg-pos-0 hover:bg-pos-100 text-white font-bold py-4 px-6 rounded-xl text-lg transition-all duration-500 hover:scale-[1.02] hover:shadow-2xl hover:shadow-purple-500/25 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-black disabled:opacity-50 disabled:cursor-not-allowed">
          <div
            class="absolute inset-0 bg-gradient-to-r from-pink-600 via-purple-600 to-pink-600 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity duration-500">
          </div>
          <div class="relative flex items-center justify-center">
            <svg *ngIf="!loading" class="mr-2 h-5 w-5 group-hover:animate-pulse" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
            <span *ngIf="!loading">Iniciar Sesión</span>
            <span *ngIf="loading" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
              Procesando...
            </span>
            <svg *ngIf="loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
              fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
            Iniciar Sesión
          </div>
        </button>

        <!-- Error Message -->
        <div *ngIf="error" class="text-red-500 text-center text-sm mt-4">
          {{ error }}
        </div>

        <!-- Divider -->
        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-700"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-gradient-to-r from-gray-900 to-black text-gray-400 font-medium">
              o continúa con
            </span>
          </div>
        </div>

        <!-- Google Login Button -->
        <button type="button"
          class="group relative w-full bg-gradient-to-r from-gray-800/60 to-gray-700/60 backdrop-blur-sm border border-gray-600/50 hover:border-gray-500/70 text-white font-bold py-4 px-6 rounded-xl text-lg transition-all duration-300 hover:scale-[1.02] hover:shadow-xl hover:shadow-gray-500/10 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 focus:ring-offset-black">
          <div class="relative flex items-center justify-center" (click)="onGoogleLogin()">
            <!-- Google Icon -->
            <svg class="mr-3 h-6 w-6" viewBox="0 0 24 24">
              <path fill="#EA4335"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
              <path fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Iniciar sesión con Google
          </div>
        </button>
      </form>

      <!-- Sign Up Link -->
      <div class="text-center mt-8 pt-6 border-t border-gray-700/50">
        <p class="text-gray-400">
          ¿No tienes cuenta?
          <a href="#" class="text-purple-400 hover:text-purple-300 transition-colors duration-300 font-bold ml-1">
            Regístrate aquí
          </a>
        </p>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="text-center mt-8">
      <p class="text-gray-500 text-sm">
        Al iniciar sesión, aceptas nuestros
        <a href="#" class="text-purple-400 hover:text-purple-300 transition-colors duration-300">términos</a>
        y
        <a href="#" class="text-purple-400 hover:text-purple-300 transition-colors duration-300">política de
          privacidad</a>
      </p>
    </div>
  </div>
</div>
