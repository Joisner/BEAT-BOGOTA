<div class="min-h-screen bg-black relative overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-br from-purple-900/20 via-black to-pink-900/20"></div>
  <div class="container mx-auto px-6 py-12 relative z-10">
    <div class="max-w-2xl mx-auto bg-black/70 rounded-2xl shadow-lg p-8 border border-purple-900/40">
      <h2 class="text-2xl font-bold text-purple-300 mb-6 text-center">Pago de Entradas</h2>
      <form class="space-y-6">
        <div>
          <label class="block text-purple-200 mb-1">Nombre completo</label>
          <input type="text" class="w-full px-4 py-2 rounded bg-gray-900 text-gray-200 border border-purple-800 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Tu nombre" />
        </div>
        <div>
          <label class="block text-purple-200 mb-1">Correo electrónico</label>
          <input type="email" class="w-full px-4 py-2 rounded bg-gray-900 text-gray-200 border border-purple-800 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="tucorreo@email.com" />
        </div>
        <div>
          <label class="block text-purple-200 mb-1">Método de pago</label>
          <select class="w-full px-4 py-2 rounded bg-gray-900 text-gray-200 border border-purple-800 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <option value="">Selecciona...</option>
            <option value="pse">PSE</option>
            <option value="tarjeta">Tarjeta de crédito</option>
          </select>
        </div>
        <!-- Mock de campos para tarjeta -->
        <div>
          <label class="block text-purple-200 mb-1">Número de tarjeta</label>
          <input type="text" class="w-full px-4 py-2 rounded bg-gray-900 text-gray-200 border border-purple-800 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="0000 0000 0000 0000" />
        </div>
        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-purple-200 mb-1">Expira</label>
            <input type="text" class="w-full px-4 py-2 rounded bg-gray-900 text-gray-200 border border-purple-800 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="MM/AA" />
          </div>
          <div class="flex-1">
            <label class="block text-purple-200 mb-1">CVC</label>
            <input type="text" class="w-full px-4 py-2 rounded bg-gray-900 text-gray-200 border border-purple-800 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="123" />
          </div>
        </div>
        <button type="submit" class="w-full px-6 py-2 rounded bg-green-600 text-white hover:bg-green-700 transition text-lg font-bold">Pagar</button>
      </form>
    </div>
  </div>
</div>
