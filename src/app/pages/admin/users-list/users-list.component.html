<div class="min-h-screen bg-black relative overflow-hidden">
    <!-- Animated Background -->
    <div class="absolute inset-0 bg-gradient-to-br from-purple-900/20 via-black to-pink-900/20"></div>
    <div
        class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-purple-500/5 via-transparent to-transparent animate-pulse">
    </div>

    <div class="container mx-auto px-6 py-12 max-w-7xl relative z-10">

        <!-- Header Section -->
        <div class="mb-12">
            <div class="flex justify-between items-center">
                <h1
                    class="text-5xl md:text-6xl font-black bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                    Usuarios de la Plataforma
                </h1>
                <a routerLink="/admin/users/new"
                    class="group inline-flex items-center px-8 py-4 bg-gradient-to-r from-purple-600 via-pink-600 to-purple-600 bg-size-200 bg-pos-0 hover:bg-pos-100 text-white font-black text-lg rounded-2xl transition-all duration-500 hover:scale-105 hover:shadow-2xl hover:shadow-purple-500/25">
                    <div
                        class="absolute inset-0 bg-gradient-to-r from-pink-600 via-purple-600 to-pink-600 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                    </div>
                    <div class="relative flex items-center">
                        <lucide-icon name="plus" class="mr-3 h-6 w-6"></lucide-icon>
                        Nuevo Usuario
                    </div>
                </a>
            </div>
        </div>

        <!-- Table Container -->
        <div
            class="bg-gradient-to-br from-gray-900/80 to-black/80 backdrop-blur-sm border border-gray-700/50 rounded-3xl shadow-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left text-gray-300">
                    <thead class="text-xs text-purple-300 uppercase bg-gray-900/80">
                        <tr>
                            <th class="px-6 py-4 font-bold">Email</th>
                            <th class="px-6 py-4 font-bold">Rol</th>
                            <th class="px-6 py-4 font-bold">Acciones</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="users.length; else loading">
                        <tr *ngFor="let user of users" class="">
                            <td class="px-6 py-4 font-medium text-white whitespace-nowrap">{{ user.email }}</td>
                            <td class="px-6 py-4 font-medium text-white whitespace-nowrap">{{ user.role }}</td>
                            <td class="px-6 py-4 text-center font-medium text-white whitespace-nowrap">
                                <button class="px-3 py-1 rounded bg-red-700 text-white hover:bg-red-800 transition">
                                    Eliminar
                                </button>
                            </td>
                        </tr>

                    </tbody>
                    <ng-template #loading>
                        <app-loading [title]="'Cargando usuarios...'"></app-loading>
                    </ng-template>
                </table>
            </div>
        </div>
    </div>
</div>
