<div class="min-h-screen bg-gray-900 text-white p-8">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-black text-purple-400">Gestionar Eventos</h1>
      <a routerLink="/admin/events/new"
        class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold rounded-full hover:scale-105 transition-transform duration-300 hover:shadow-2xl hover:shadow-purple-500/25">
        <lucide-icon name="plus" class="mr-2 h-6 w-6"></lucide-icon>
        Crear Nuevo Evento
      </a>
    </div>

    <div class="bg-gray-800/50 backdrop-blur-sm border border-purple-500/30 rounded-2xl shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm text-left text-gray-300">
          <thead class="text-xs text-purple-300 uppercase bg-gray-900/80">
            <tr>
              <th scope="col" class="px-6 py-4">Evento</th>
              <th scope="col" class="px-6 py-4">Fecha</th>
              <th scope="col" class="px-6 py-4">Ubicación</th>
              <th scope="col" class="px-6 py-4">Promotores</th>
              <th scope="col" class="px-6 py-4 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody *ngIf="events$ | async as events; else loading">
            <tr *ngFor="let event of events"
              class="border-b border-gray-700 hover:bg-gray-800/70 transition-colors duration-200">
              <td class="px-6 py-4 font-medium text-white whitespace-nowrap">{{ event.name }}</td>
              <td class="px-6 py-4">{{ event.date | date:'d MMMM, yyyy • h:mm a' }}</td>
              <td class="px-6 py-4">{{ event.location }}</td>
              <td class="px-6 py-4">{{ getPromotorNombres(event.promotores) }}</td>
              <td class="px-6 py-4 text-center">
                <a [routerLink]="['/admin/events/edit', event.id]"
                  class="text-cyan-400 hover:text-cyan-300 mr-4 font-semibold transition-colors duration-200">
                  <lucide-icon name="pencil" class="inline-block h-5 w-5"></lucide-icon>
                  Editar
                </a>
                <button (click)="deleteEvent(event.id)"
                  class="text-pink-500 hover:text-pink-400 font-semibold transition-colors duration-200">
                  <lucide-icon name="trash-2" class="inline-block h-5 w-5"></lucide-icon>
                  Eliminar
                </button>
              </td>
            </tr>
            <tr *ngIf="events.length === 0">
              <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                No hay eventos para mostrar. ¡Crea el primero!
              </td>
            </tr>
          </tbody>
          <ng-template #loading>
            <tr>
              <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-500 border-t-transparent"></div>
                <p class="mt-2">Cargando eventos...</p>
              </td>
            </tr>
          </ng-template>
        </table>
      </div>
    </div>
  </div>
</div>
