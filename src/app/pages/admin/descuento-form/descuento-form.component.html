<h2>Crear/Editar Descuento</h2>
<form [formGroup]="descuentoForm" (ngSubmit)="onSubmit()" class="space-y-6">
  <div>
    <label>Código</label>
    <input formControlName="codigo" type="text" class="input" />
  </div>
  <div>
    <label>Descripción</label>
    <input formControlName="descripcion" type="text" class="input" />
  </div>
  <div>
    <label>Tipo</label>
    <select formControlName="tipo" class="input">
      <option *ngFor="let t of tipos" [value]="t">{{ t }}</option>
    </select>
  </div>
  <div *ngIf="descuentoForm.get('tipo')?.value === 'promotor'">
    <label>Promotor</label>
    <select formControlName="promotorId" class="input">
      <option value="">Selecciona un promotor</option>
      <option *ngFor="let p of promotores" [value]="p.id">{{ p.nombre }}</option>
    </select>
  </div>
  <div *ngIf="descuentoForm.get('tipo')?.value === 'entrada'">
    <label>Tipo de Entrada</label>
    <input formControlName="entradaTipo" type="text" class="input" placeholder="ej. VIP, General" />
  </div>
  <div>
    <label>Valor (%)</label>
    <input formControlName="valor" type="number" min="1" class="input" />
  </div>
  <div>
    <label>Activo</label>
    <input formControlName="activo" type="checkbox" />
  </div>
  <button type="submit" [disabled]="descuentoForm.invalid" class="btn">Guardar</button>
</form>
