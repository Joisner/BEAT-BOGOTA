<div class="min-h-screen bg-gray-900 text-white p-8">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-black text-purple-400">Gestionar Promotores</h1>
      <a routerLink="/admin/promoters/new"
        class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold rounded-full hover:scale-105 transition-transform duration-300 hover:shadow-2xl hover:shadow-purple-500/25">
        <lucide-icon name="plus" class="mr-2 h-6 w-6"></lucide-icon>
        Nuevo Promotor
      </a>
    </div>

    <div class="bg-gray-800/50 backdrop-blur-sm border border-purple-500/30 rounded-2xl shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm text-left text-gray-300">
          <thead class="text-xs text-purple-300 uppercase bg-gray-900/80">
            <tr>
              <th scope="col" class="px-6 py-4">Nombre</th>
              <th scope="col" class="px-6 py-4">WhatsApp</th>
              <th scope="col" class="px-6 py-4">Perfil</th>
              <th scope="col" class="px-6 py-4 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody *ngIf="promoters.length; else loading">
            <tr *ngFor="let promoter of promoters" class="border-b border-gray-700 hover:bg-gray-800/70 transition-colors duration-200">
              <td class="px-6 py-4 font-medium text-white whitespace-nowrap">{{ promoter.name }}</td>
              <td class="px-6 py-4">
                <a *ngIf="promoter.whatsapp" [href]="promoter.whatsapp" target="_blank" rel="noopener" 
                   class="inline-flex items-center text-green-400 hover:text-green-300 transition-colors duration-200">
                  <lucide-icon name="phone" class="mr-2 h-4 w-4"></lucide-icon>
                  WhatsApp
                </a>
                <span *ngIf="!promoter.whatsapp" class="text-gray-500">No disponible</span>
              </td>
              <td class="px-6 py-4">
                <a *ngIf="promoter.profile_url" [href]="promoter.profile_url" target="_blank" rel="noopener" 
                   class="inline-flex items-center text-cyan-400 hover:text-cyan-300 transition-colors duration-200">
                  <lucide-icon name="external-link" class="mr-2 h-4 w-4"></lucide-icon>
                  Ver Perfil
                </a>
                <span *ngIf="!promoter.profile_url" class="text-gray-500">No disponible</span>
              </td>
              <td class="px-6 py-4 text-center">
                <a [routerLink]="['/admin/promoters/edit', promoter.id]" 
                   class="text-cyan-400 hover:text-cyan-300 mr-4 font-semibold transition-colors duration-200">
                  <lucide-icon name="pencil" class="inline-block h-5 w-5"></lucide-icon>
                  Editar
                </a>
                <button (click)="deletePromoter(promoter.id)" 
                        class="text-pink-500 hover:text-pink-400 font-semibold transition-colors duration-200">
                  <lucide-icon name="trash-2" class="inline-block h-5 w-5"></lucide-icon>
                  Eliminar
                </button>
              </td>
            </tr>
            <tr *ngIf="promoters.length === 0">
              <td colspan="4" class="px-6 py-12 text-center text-gray-400">
                No hay promotores para mostrar. ¡Crea el primero!
              </td>
            </tr>
          </tbody>
          <ng-template #loading>
            <app-loading [title]="'Cargando promotores...'"></app-loading>
          </ng-template>
        </table>
      </div>
    </div>
  </div>
</div>
