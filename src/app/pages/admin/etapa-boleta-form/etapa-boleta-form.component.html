<h2>Crear/Editar Etapa de Boleta</h2>
<form [formGroup]="etapaForm" (ngSubmit)="onSubmit()" class="space-y-6">
  <div>
    <label>Nombre</label>
    <input formControlName="nombre" type="text" class="input" />
  </div>
  <div>
    <label>Fecha Inicio</label>
    <input formControlName="fechaInicio" type="date" class="input" />
  </div>
  <div>
    <label>Fecha Fin</label>
    <input formControlName="fechaFin" type="date" class="input" />
  </div>
  <div>
    <label>Precio</label>
    <input formControlName="precio" type="number" min="1" class="input" />
  </div>
  <div>
    <label>Disponibilidad</label>
    <input formControlName="disponibilidad" type="number" min="1" class="input" />
  </div>
  <div>
    <label>Activa</label>
    <input formControlName="activa" type="checkbox" />
  </div>
  <button type="submit" [disabled]="etapaForm.invalid" class="btn">Guardar</button>
</form>
