<div class="min-h-screen bg-gray-900 text-white p-8">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-black text-purple-400">Descuentos</h1>
      <a routerLink="/admin/descuentos/new"
        class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold rounded-full hover:scale-105 transition-transform duration-300 hover:shadow-2xl hover:shadow-purple-500/25">
        <lucide-icon name="plus" class="mr-2 h-6 w-6"></lucide-icon>
        Crear Descuento
      </a>
    </div>
    <div class="bg-gray-800/50 backdrop-blur-sm border border-purple-500/30 rounded-2xl shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm text-left text-gray-300">
          <thead class="text-xs text-purple-300 uppercase bg-gray-900/80">
            <tr>
              <th class="px-6 py-4">Código</th>
              <th class="px-6 py-4">Descripción</th>
              <th class="px-6 py-4">Tipo</th>
              <th class="px-6 py-4">Valor</th>
              <th class="px-6 py-4">Activo</th>
              <th class="px-6 py-4 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody *ngIf="descuentos.length; else loading">
            <tr *ngFor="let d of descuentos" class="border-b border-gray-700 hover:bg-gray-800/70 transition-colors duration-200">
              <td class="px-6 py-4 font-medium text-white whitespace-nowrap">{{ d.codigo }}</td>
              <td class="px-6 py-4">{{ d.descripcion }}</td>
              <td class="px-6 py-4">{{ d.tipo }}</td>
              <td class="px-6 py-4">{{ d.valor }}%</td>
              <td class="px-6 py-4">{{ d.activo ? 'Sí' : 'No' }}</td>
              <td class="px-6 py-4 text-center">
                <a [routerLink]="['/admin/descuentos/edit', d.id]" class="text-cyan-400 hover:text-cyan-300 mr-4 font-semibold transition-colors duration-200">
                  <lucide-icon name="pencil" class="inline-block h-5 w-5"></lucide-icon>
                  Editar
                </a>
                <button (click)="eliminarDescuento(d.id)" class="text-pink-500 hover:text-pink-400 font-semibold transition-colors duration-200">
                  <lucide-icon name="trash-2" class="inline-block h-5 w-5"></lucide-icon>
                  Eliminar
                </button>
              </td>
            </tr>
            <tr *ngIf="descuentos.length === 0">
              <td colspan="6" class="px-6 py-12 text-center text-gray-400">
                No hay descuentos para mostrar.
              </td>
            </tr>
          </tbody>
          <ng-template #loading>
            <tr>
              <td colspan="6" class="px-6 py-12 text-center text-gray-400">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-500 border-t-transparent"></div>
                <p class="mt-2">Cargando descuentos...</p>
              </td>
            </tr>
          </ng-template>
        </table>
      </div>
    </div>
  </div>
</div>
